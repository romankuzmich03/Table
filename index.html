<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Table</title>

  <style>
    body {
      margin: 0;
      background: white;
    }

    table {
      border-collapse: collapse;
      margin: 20px auto;
      border: 8px solid black;
      table-layout: fixed;
    }

    td {
      border: 8px solid black;
      background: white;
      padding: 0;
    }

    .r1 { height: 90px; }
    .r2 { height: 140px; }
    .r3 { height: 140px; }
    .r4 { height: 110px; }
    .r5 { height: 90px; }
    .r6 { height: 75px; }
    .r7 { height: 75px; }
    .r8 { height: 75px; }
    .r9 { height: 45px; }

    .c1 { width: 90px; }
    .c2 { width: 120px; }
    .c3 { width: 120px; }
    .c4 { width: 120px; }
    .c5 { width: 120px; }
    .c6 { width: 105px; }
    .c7 { width: 105px; }
    .c8 { width: 45px; }

    .red { background: red; }
    .yellow { background: yellow; }
    .blue { background: blue; }
    .black { background: black; }

    .no-top { border-top: 0; }
    .no-bottom { border-bottom: 0; }
    .no-left { border-left: 0; }
    .no-right { border-right: 0; }
  </style>
</head>

<body>

  <table>
    <colgroup>
      <col class="c1">
      <col class="c2">
      <col class="c3">
      <col class="c4">
      <col class="c5">
      <col class="c6">
      <col class="c7">
      <col class="c8">
    </colgroup>

    <tr class="r1">
      <td colspan="2"></td>
      <td colspan="3"></td>
      <td colspan="2" class="yellow"></td>
      <td></td>
    </tr>

    <tr class="r2">
      <td rowspan="2"></td>
      <td colspan="4" rowspan="4" class="red"></td>
      <td colspan="2" class="yellow no-bottom"></td>
      <td rowspan="5"></td>
    </tr>

    <tr class="r3">
      <td colspan="2" class="yellow no-top"></td>
    </tr>

    <tr class="r4">
      <td rowspan="3"></td>
      <td class="no-bottom"></td>
      <td class="no-bottom"></td>
    </tr>

    <tr class="r5">
      <td class="no-top"></td>
      <td class="no-top"></td>
    </tr>

    <tr class="r6">
      <td colspan="2" rowspan="2" class="black"></td>
      <td class="no-right"></td>
      <td class="no-left"></td>
      <td colspan="2"></td>
    </tr>

    <tr class="r7">
      <td rowspan="3" class="yellow"></td>
      <td colspan="2"></td>
      <td colspan="2" rowspan="2" class="blue"></td>
      <td rowspan="3" class="red"></td>
    </tr>

    <tr class="r8">
      <td colspan="2" rowspan="2"></td>
      <td colspan="2" class="black"></td>
    </tr>

    <tr class="r9">
      <td colspan="4"></td>
    </tr>
  </table>

</body>

</html>
